[project]
name = "puffin"
version = "0.1.0"
description = "Probabilistic disaggregation of socioeconomic variables from AlphaEarth embeddings"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "geopandas",
    "rasterio",
    "rioxarray",
    "shapely",
    "pyproj",
    "fiona",
    "torch>=2.1",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tqdm",
    "contextily>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "jupyterlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puffin"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "jupyterlab",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
